# Foreign equities for `valuescan --foreign`. Market cap is converted to USD at runtime,
# so the $1B floor applies uniformly. Yahoo suffixes: .T Tokyo, .HK Hong Kong, .KS Korea,
# .TW Taiwan, .L London, .DE Xetra, .PA Paris, .AS Amsterdam, .SW Swiss, .MI Milan,
# .MC Madrid, .CO Copenhagen, .ST Stockholm, .OL Oslo, .AX Australia, .NS India,
# .SA Brazil, .TO Toronto, .MX Mexico.
#
# US-listed ADRs whose company reports in another currency get `currency_mismatch`;
# their EV/EBITDA, FCF yield and Graham ratio are dropped rather than trusted.
# Local listings are chosen mostly where no liquid US ADR exists, to limit duplicates.

